---
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Start and enable Nginx
  service:
    name: nginx
    state: started
    enabled: yes

- name: Deploy portfolio website files
  copy:
    src: "{{ role_path }}/files/"
    dest: /var/www/html/
    owner: www-data
    group: www-data
    mode: "0644"
